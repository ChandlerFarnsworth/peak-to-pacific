<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Peak to Pacific — Gallery</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <meta name="theme-color" content="#0d1219" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ── Gallery grid ────────────────────────────────────── */
    .gallery-grid {
      columns: 3;
      column-gap: 12px;
    }
    @media (max-width: 860px) { .gallery-grid { columns: 2; } }
    @media (max-width: 500px) { .gallery-grid { columns: 1; } }

    .gallery-item {
      break-inside: avoid;
      margin-bottom: 12px;
      position: relative;
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
      background: var(--bg-card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      transition: transform .25s, border-color .2s, box-shadow .2s;
    }
    .gallery-item:hover { transform: translateY(-3px); border-color: var(--border-light); box-shadow: var(--shadow); }
    .gallery-item img {
      width: 100%; display: block;
      transition: transform .3s;
    }
    .gallery-item:hover img { transform: scale(1.04); }

    .gallery-caption {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 28px 13px 11px;
      background: linear-gradient(to top, rgba(0,0,0,0.82) 0%, transparent 100%);
      opacity: 0;
      transition: opacity .25s;
    }
    .gallery-item:hover .gallery-caption { opacity: 1; }
    .cap-text { font-size: 0.78rem; font-weight: 600; color: #fff; line-height: 1.3; }
    .cap-loc  { font-size: 0.68rem; color: var(--gold); margin-top: 2px; }

    /* ── Filter bar ──────────────────────────────────────── */
    .filter-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 24px;
    }

    .filter-btn {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 5px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all .2s;
      letter-spacing: 0.03em;
      font-family: var(--font-body);
    }
    .filter-btn:hover,
    .filter-btn.active {
      background: var(--bg-elevated);
      border-color: var(--gold);
      color: var(--gold);
    }

    .photo-count {
      margin-left: auto;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* ── Upload button ───────────────────────────────────── */
    .upload-cta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-secondary);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 5px 14px;
      text-decoration: none;
      transition: all .2s;
      letter-spacing: 0.03em;
    }
    .upload-cta:hover {
      border-color: var(--gold);
      color: var(--gold);
    }

    /* ── Loading skeleton ────────────────────────────────── */
    .skeleton-grid {
      columns: 3;
      column-gap: 12px;
    }
    @media (max-width: 860px) { .skeleton-grid { columns: 2; } }
    @media (max-width: 500px) { .skeleton-grid { columns: 1; } }

    .skeleton-item {
      break-inside: avoid;
      margin-bottom: 12px;
      border-radius: 4px;
      background: linear-gradient(90deg, var(--bg-elevated) 25%, var(--border) 50%, var(--bg-elevated) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.6s infinite;
    }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    /* ── Empty state ─────────────────────────────────────── */
    .gallery-empty {
      text-align: center;
      padding: 64px 24px;
      background: var(--bg-card);
      border: 2px dashed var(--border);
      border-radius: 4px;
    }
    .gallery-empty .empty-icon { font-size: 3rem; margin-bottom: 16px; }
    .gallery-empty h3 {
      font-family: var(--font-display);
      font-size: 1.4rem;
      letter-spacing: 0.03em;
      margin-bottom: 10px;
    }
    .gallery-empty p {
      color: var(--text-secondary);
      font-size: 0.875rem;
      max-width: 400px;
      margin: 0 auto 20px;
      line-height: 1.7;
    }
    .gallery-empty code {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 7px;
      font-size: 0.8rem;
      color: var(--gold);
      font-family: monospace;
    }

    /* ── Google Photos card ──────────────────────────────── */
    .gphoto-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 32px;
    }

    .gphoto-header {
      background: var(--dark);
      padding: 28px 32px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .gphoto-icon {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: rgba(61,154,200,0.15);
      border: 1px solid rgba(61,154,200,0.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
      flex-shrink: 0;
    }

    .gphoto-title {
      font-family: var(--font-display);
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #fff;
      line-height: 1.2;
    }

    .gphoto-sub {
      font-size: 0.78rem;
      color: rgba(255,255,255,0.45);
      margin-top: 3px;
    }

    .gphoto-body {
      padding: 24px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .gphoto-desc {
      font-size: 0.87rem;
      color: var(--text-secondary);
      line-height: 1.6;
      max-width: 480px;
    }

    .gphoto-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--gold);
      color: #fff;
      font-family: var(--font-body);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 11px 22px;
      border-radius: 4px;
      transition: background .2s, transform .15s;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .gphoto-btn:hover { background: var(--gold-dim); transform: translateY(-1px); }

    .gphoto-setup {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-left: 3px solid var(--gold);
      border-radius: 4px;
      padding: 16px 20px;
      margin-bottom: 28px;
      font-size: 0.82rem;
      color: var(--text-secondary);
      line-height: 1.6;
    }
    .gphoto-setup strong { color: var(--gold); }
    .gphoto-setup code {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 0.75rem;
      color: var(--text-primary);
    }

    /* ── Cloudinary banner ───────────────────────────────── */
    .cloudinary-setup {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-left: 3px solid var(--gold);
      border-radius: 4px;
      padding: 16px 20px;
      margin-bottom: 28px;
      font-size: 0.82rem;
      color: var(--text-secondary);
      line-height: 1.6;
    }
    .cloudinary-setup strong { color: var(--gold); }
    .cloudinary-setup code {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 0.75rem;
      color: var(--text-primary);
    }

    /* ── Lightbox ────────────────────────────────────────── */
    .lightbox {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.93);
      z-index: 9000;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity .25s;
      padding: 20px;
    }
    .lightbox.open { opacity: 1; pointer-events: all; }

    .lightbox-inner {
      position: relative;
      max-width: 920px;
      max-height: 90vh;
      width: 100%;
    }

    .lightbox-img {
      max-width: 100%;
      max-height: 82vh;
      border-radius: 4px;
      object-fit: contain;
      display: block;
      margin: 0 auto;
    }

    .lightbox-meta { text-align: center; margin-top: 14px; }
    .lb-caption { font-family: var(--font-display); font-size: 1.1rem; letter-spacing: .03em; }
    .lb-loc     { font-size: 0.78rem; color: var(--gold); margin-top: 4px; }

    .lightbox-close {
      position: fixed; top: 18px; right: 20px;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 50%;
      width: 38px; height: 38px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--text-primary); font-size: 1.1rem;
      z-index: 9001; transition: background .2s;
    }
    .lightbox-close:hover { background: var(--bg-elevated); }

    .lightbox-nav {
      position: fixed; top: 50%; transform: translateY(-50%);
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 10px 9px;
      cursor: pointer; color: var(--text-primary); font-size: 1.2rem;
      z-index: 9001; transition: all .2s;
    }
    .lightbox-nav:hover { background: var(--bg-elevated); border-color: var(--gold); }
    .lightbox-prev { left: 14px; }
    .lightbox-next { right: 14px; }
  </style>
</head>
<body>

<!-- ── Navigation ─────────────────────────────────────── -->
<nav class="nav">
  <a href="index.html" class="nav-brand">
    Peak <span class="accent">&nbsp;/&nbsp;</span> Pacific
  </a>
  <ul class="nav-links" id="navLinks">
    <li><a href="index.html">Map</a></li>
    <li><a href="agenda.html">Agenda</a></li>
    <li><a href="stats.html">Stats</a></li>
    <li><a href="gallery.html" class="active">Gallery</a></li>
  </ul>
  <button class="nav-mobile-btn" id="mobileBtn" aria-label="Menu">
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
      <path d="M3 6h16M3 11h16M3 16h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </button>
</nav>

<!-- ── Lightbox ───────────────────────────────────────── -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lbClose">✕</button>
  <button class="lightbox-nav lightbox-prev" id="lbPrev">‹</button>
  <button class="lightbox-nav lightbox-next" id="lbNext">›</button>
  <div class="lightbox-inner">
    <img class="lightbox-img" id="lbImg" src="" alt="" />
    <div class="lightbox-meta">
      <div class="lb-caption" id="lbCaption"></div>
      <div class="lb-loc" id="lbLoc"></div>
    </div>
  </div>
</div>

<!-- ── Page Hero ───────────────────────────────────────── -->
<div class="page-hero hero-short" style="background-image:url('images/heroes/gallery.jpg')">
  <div class="hero-inner">
    <div class="hero-content">
      <div class="hero-eyebrow">Along the Way</div>
      <h1 class="hero-title">Photo Gallery</h1>
      <p class="hero-subtitle">Moments from the road — drop a photo in, it shows up here</p>
    </div>
  </div>
</div>
<!-- Mountain divider -->
<svg class="mountain-divider" viewBox="0 0 1440 72" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <path d="M0,72 L0,54 L120,36 L220,54 L340,22 L440,46 L540,16 L640,40 L740,24 L840,50 L960,18 L1080,44 L1180,26 L1300,50 L1440,32 L1440,72 Z" fill="#071209"/>
</svg>

<!-- ── Main ───────────────────────────────────────────── -->
<main class="page-content">
  <div class="container">

    <!-- Filter + count bar -->
    <div class="filter-bar" id="filterBar">
      <span class="photo-count" id="photoCount">Loading photos…</span>
    </div>

    <!-- Gallery grid -->
    <div id="galleryContainer"></div>

  </div>
</main>

<footer class="footer">
  <svg class="footer-mountains" viewBox="0 0 1440 60" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path d="M0,60 L0,42 L90,28 L180,40 L300,15 L400,32 L500,10 L600,28 L700,18 L800,35 L920,12 L1040,30 L1160,18 L1280,38 L1440,22 L1440,60 Z" fill="rgba(232,184,75,0.07)"/>
  </svg>
  <div class="footer-brand">Peak to Pacific</div>
  <div>Chandler &amp; Teigan · CU Boulder Class of '26 · 🤘</div>
</footer>

<script src="config.js"></script>
<script src="nav-scroll.js" defer></script>
<script>
  document.getElementById('mobileBtn').addEventListener('click', () => {
    document.getElementById('navLinks').classList.toggle('open');
  });

  // ── Config ─────────────────────────────────────────────────
  const TOTAL   = typeof GALLERY_COUNT !== 'undefined' ? GALLERY_COUNT : 50;
  const container = document.getElementById('galleryContainer');
  const countEl   = document.getElementById('photoCount');
  const filterBar  = document.getElementById('filterBar');

  // Build a lookup map from the optional GALLERY metadata array
  const META = {};
  (typeof GALLERY !== 'undefined' ? GALLERY : []).forEach(function(g) {
    if (g.n) META[g.n] = g;
  });

  // loadedPhotos is built as images successfully load
  var loadedPhotos = [];
  var activeFilter = 'All';
  var currentIdx   = 0;

  // ── Render all probes up-front ─────────────────────────────
  // Images that don't exist get removed via onerror.
  // Images that load call photoLoaded() to register themselves.
  function renderGrid() {
    var html = '<div class="gallery-grid" id="photoGrid">';
    for (var i = 1; i <= TOTAL; i++) {
      var m = META[i] || {};
      var capHtml = (m.caption || m.location)
        ? '<div class="gallery-caption">'
            + (m.caption  ? '<div class="cap-text">' + m.caption  + '</div>' : '')
            + (m.location ? '<div class="cap-loc">📍 ' + m.location + '</div>' : '')
          + '</div>'
        : '';
      html += '<div class="gallery-item" id="gi-' + i + '" data-n="' + i
            + '" data-loc="' + (m.location || '') + '"'
            + ' style="display:none" tabindex="0" role="button">'
            + '<img src="images/gallery/' + i + '.JPG"'
            + ' alt="' + (m.caption || 'Photo ' + i) + '"'
            + ' loading="lazy"'
            + ' onload="photoLoaded(' + i + ')"'
            + ' onerror="document.getElementById(\'gi-' + i + '\').remove()"'
            + '/>'
            + capHtml
            + '</div>';
    }
    html += '</div>';
    container.innerHTML = html;

    // Delegated click handler
    container.addEventListener('click', function(e) {
      var item = e.target.closest('.gallery-item');
      if (!item) return;
      var n = parseInt(item.dataset.n);
      var visible = getVisible();
      var idx = visible.findIndex(function(p) { return p.n === n; });
      if (idx >= 0) openLightbox(visible, idx);
    });
    container.addEventListener('keydown', function(e) {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      var item = e.target.closest('.gallery-item');
      if (!item) return;
      var n = parseInt(item.dataset.n);
      var visible = getVisible();
      var idx = visible.findIndex(function(p) { return p.n === n; });
      if (idx >= 0) openLightbox(visible, idx);
    });
  }

  function photoLoaded(n) {
    var item = document.getElementById('gi-' + n);
    if (!item) return;
    item.style.display = '';
    var m = META[n] || {};
    if (!loadedPhotos.find(function(p) { return p.n === n; })) {
      loadedPhotos.push({ n: n, url: 'images/gallery/' + n + '.JPG', caption: m.caption || '', location: m.location || '' });
      loadedPhotos.sort(function(a, b) { return a.n - b.n; });
    }
    updateBar();
  }

  // ── Filter bar ─────────────────────────────────────────────
  function updateBar() {
    var count = loadedPhotos.length;
    countEl.textContent = count + ' photo' + (count !== 1 ? 's' : '');

    // Rebuild location filters if any metadata exists
    var locs = ['All'].concat(
      loadedPhotos
        .map(function(p) { return p.location; })
        .filter(function(l, i, a) { return l && a.indexOf(l) === i; })
    );
    if (locs.length > 2) {
      filterBar.querySelectorAll('.filter-btn').forEach(function(b) { b.remove(); });
      locs.forEach(function(loc) {
        var btn = document.createElement('button');
        btn.className = 'filter-btn' + (loc === activeFilter ? ' active' : '');
        btn.textContent = loc;
        btn.addEventListener('click', function() {
          activeFilter = loc;
          filterBar.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
          btn.classList.add('active');
          applyFilter();
        });
        filterBar.insertBefore(btn, countEl);
      });
    }
  }

  function getVisible() {
    return activeFilter === 'All'
      ? loadedPhotos
      : loadedPhotos.filter(function(p) { return p.location === activeFilter; });
  }

  function applyFilter() {
    loadedPhotos.forEach(function(p) {
      var el = document.getElementById('gi-' + p.n);
      if (!el) return;
      var show = activeFilter === 'All' || p.location === activeFilter;
      el.style.display = show ? '' : 'none';
    });
  }

  // ── Lightbox ───────────────────────────────────────────────
  var lbPhotos = [];

  function openLightbox(photos, idx) {
    lbPhotos    = photos;
    currentIdx  = idx;
    showLb();
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function showLb() {
    var p = lbPhotos[currentIdx];
    if (!p) return;
    document.getElementById('lbImg').src            = p.url;
    document.getElementById('lbImg').alt            = p.caption || '';
    document.getElementById('lbCaption').textContent = p.caption || '';
    document.getElementById('lbLoc').textContent     = p.location ? '📍 ' + p.location : '';
  }

  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
    document.body.style.overflow = '';
  }

  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  document.getElementById('lightbox').addEventListener('click', function(e) {
    if (e.target === document.getElementById('lightbox')) closeLightbox();
  });
  document.getElementById('lbPrev').addEventListener('click', function(e) {
    e.stopPropagation();
    currentIdx = (currentIdx - 1 + lbPhotos.length) % lbPhotos.length;
    showLb();
  });
  document.getElementById('lbNext').addEventListener('click', function(e) {
    e.stopPropagation();
    currentIdx = (currentIdx + 1) % lbPhotos.length;
    showLb();
  });
  document.addEventListener('keydown', function(e) {
    if (!document.getElementById('lightbox').classList.contains('open')) return;
    if (e.key === 'Escape')      closeLightbox();
    if (e.key === 'ArrowLeft')  { currentIdx = (currentIdx - 1 + lbPhotos.length) % lbPhotos.length; showLb(); }
    if (e.key === 'ArrowRight') { currentIdx = (currentIdx + 1) % lbPhotos.length; showLb(); }
  });

  // ── Empty state (shown after a short wait if nothing loaded) ─
  setTimeout(function() {
    if (loadedPhotos.length === 0) {
      countEl.textContent = '';
      container.innerHTML = '<div class="gallery-empty">'
        + '<div class="empty-icon">📸</div>'
        + '<h3>Photos coming soon!</h3>'
        + '<p>Drop your photos into the <code>images/gallery/</code> folder named '
        + '<code>1.JPG</code>, <code>2.JPG</code>, etc. and push to GitHub — '
        + 'they\'ll appear here automatically.</p>'
        + '</div>';
    }
  }, 4000);

  // ── Go ─────────────────────────────────────────────────────
  renderGrid();
</script>
</body>
</html>
