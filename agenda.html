<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Peak to Pacific — Agenda</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <meta name="theme-color" content="#0d1219" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ── Phase header ────────────────────────────────────── */
    .phase-group { margin-bottom: 40px; }

    .phase-label {
      font-family: var(--font-display);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .phase-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── Stop cards ──────────────────────────────────────── */
    .stops-list {
      display: flex;
      flex-direction: column;
      gap: 0;
      position: relative;
    }

    .stops-list::before {
      content: '';
      position: absolute;
      left: 22px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: linear-gradient(to bottom, var(--green) var(--completed-pct, 0%), var(--border) var(--completed-pct, 0%));
      z-index: 0;
    }

    .stop-item {
      display: flex;
      gap: 0;
      position: relative;
      z-index: 1;
    }

    /* Timeline dot */
    .stop-timeline {
      flex-shrink: 0;
      width: 46px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 18px;
    }

    .stop-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
      z-index: 2;
    }

    .stop-dot.completed {
      background: var(--gold);
      border: 2px solid var(--gold);
    }

    .stop-dot.current {
      background: var(--gold);
      border: 2px solid var(--gold);
      box-shadow: 0 0 0 4px rgba(61,154,200,0.22);
      animation: stop-pulse 2s infinite;
    }

    .stop-dot.upcoming {
      background: var(--bg-card);
      border: 2px solid var(--border);
    }

    @keyframes stop-pulse {
      0%, 100% { box-shadow: 0 0 0 3px rgba(61,154,200,0.28); }
      50%       { box-shadow: 0 0 0 7px rgba(61,154,200,0.07); }
    }

    /* Stop card */
    .stop-card {
      flex: 1;
      margin: 8px 0 8px 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
      transition: border-color .2s, transform .15s;
    }

    .stop-card:hover {
      border-color: var(--border-light);
      transform: translateX(2px);
    }

    .stop-card.completed {
      opacity: 0.6;
    }

    .stop-card.current {
      border-color: rgba(61,154,200,0.4);
      background: linear-gradient(135deg, var(--bg-card) 0%, rgba(61,154,200,0.04) 100%);
    }

    .stop-card-inner {
      padding: 16px 20px;
    }

    .stop-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .stop-name-block { flex: 1; }

    .stop-emoji-name {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .stop-emoji { font-size: 1.1rem; line-height: 1; }

    .stop-name {
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: var(--text-primary);
      line-height: 1.2;
    }

    .stop-card.completed .stop-name { color: var(--text-secondary); }

    .stop-subtitle {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 2px;
      margin-left: 26px;
    }

    .stop-dates {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .stop-card.current .stop-dates { color: var(--gold); }

    /* Highlights */
    .stop-highlights {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .highlight-chip {
      font-size: 0.72rem;
      color: var(--text-secondary);
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 3px 10px;
    }

    .stop-card.completed .highlight-chip {
      color: var(--text-muted);
      background: var(--bg-elevated);
    }

    /* Current stop special label */
    .you-are-here {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 20px;
      background: rgba(61,154,200,0.07);
      border-top: 1px solid rgba(61,154,200,0.18);
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--gold);
    }

    /* Nights badge */
    .nights-badge {
      font-size: 0.68rem;
      color: var(--text-muted);
      margin-left: auto;
      white-space: nowrap;
    }

    /* Summary bar */
    .agenda-summary {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 18px 24px;
      margin-bottom: 32px;
    }

    .summary-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .summary-item .s-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .summary-item .s-value {
      font-family: var(--font-display);
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--gold);
    }

    .summary-divider {
      width: 1px;
      background: var(--border);
      align-self: stretch;
    }

    @media (max-width: 600px) {
      .stops-list::before { left: 18px; }
      .stop-timeline { width: 38px; }
      .stop-name { font-size: 1rem; }
    }

    /* ── Tab bar ─────────────────────────────────────────── */
    .tab-bar {
      display: flex;
      gap: 0;
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 28px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px 0;
      background: var(--bg-card);
      border: none;
      color: var(--text-muted);
      font-family: var(--font-display);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background .2s, color .2s;
    }

    .tab-btn + .tab-btn { border-left: 1px solid var(--border); }

    .tab-btn.active {
      background: var(--gold);
      color: #fff;
    }

    .tab-btn:not(.active):hover {
      background: var(--bg-elevated);
      color: var(--text-primary);
    }

    /* ── Tab panels ──────────────────────────────────────── */
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── Day cards ───────────────────────────────────────── */
    .day-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 4px;
      margin-bottom: 10px;
      overflow: hidden;
      transition: border-color .2s;
    }

    .day-card:hover { border-color: var(--border-light); }
    .day-card.open { border-color: rgba(61,154,200,0.35); }

    .day-card-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 20px;
      cursor: pointer;
      user-select: none;
    }

    .day-num {
      font-family: var(--font-display);
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      width: 36px;
      flex-shrink: 0;
    }

    .day-card.open .day-num,
    .day-card.today .day-num { color: var(--gold); }

    .day-meta { flex: 1; min-width: 0; }

    .day-route {
      font-family: var(--font-display);
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.2;
    }

    .day-card.past .day-route { color: var(--text-secondary); }
    .day-card.today .day-route { color: var(--gold); }

    .day-subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .day-badges {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .day-badge {
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-muted);
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 3px 8px;
      white-space: nowrap;
    }

    .day-badge.today-badge {
      color: var(--gold);
      border-color: rgba(61,154,200,0.35);
      background: rgba(61,154,200,0.07);
    }

    .day-chevron {
      flex-shrink: 0;
      color: var(--text-muted);
      transition: transform .25s;
    }

    .day-card.open .day-chevron { transform: rotate(180deg); }

    .day-card-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height .35s ease;
    }

    .day-card.open .day-card-body { max-height: 600px; }

    .day-card-inner { padding: 0 20px 18px 70px; }

    .day-plan-list {
      list-style: none;
      margin: 0 0 10px;
      padding: 0;
    }

    .day-plan-list li {
      font-size: 0.82rem;
      color: var(--text-secondary);
      padding: 5px 0;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .day-plan-list li:last-child { border-bottom: none; }

    .day-plan-list li::before {
      content: '—';
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .day-note {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-style: italic;
      margin-top: 8px;
    }

    @media (max-width: 600px) {
      .day-card-inner { padding-left: 20px; }
      .day-badge:not(.today-badge) { display: none; }
    }
  </style>
</head>
<body>

<!-- ── Navigation ─────────────────────────────────────── -->
<nav class="nav">
  <a href="index.html" class="nav-brand">
    Peak <span class="accent">&nbsp;/&nbsp;</span> Pacific
  </a>
  <ul class="nav-links" id="navLinks">
    <li><a href="index.html">Map</a></li>
    <li><a href="agenda.html" class="active">Agenda</a></li>
    <li><a href="stats.html">Stats</a></li>
    <li><a href="gallery.html">Gallery</a></li>
  </ul>
  <button class="nav-mobile-btn" id="mobileBtn" aria-label="Menu">
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
      <path d="M3 6h16M3 11h16M3 16h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </button>
</nav>

<!-- ── Page Hero ───────────────────────────────────────── -->
<div class="page-hero hero-short" style="background-image:url('images/heroes/agenda.jpg')">
  <div class="hero-inner">
    <div class="hero-content">
      <div class="hero-eyebrow">The Full Journey</div>
      <h1 class="hero-title">Trip Agenda</h1>
      <p class="hero-subtitle">Boulder → Tetons → Zion → Yosemite → LA → Arches → Home</p>
    </div>
  </div>
</div>
<!-- Mountain divider -->
<svg class="mountain-divider" viewBox="0 0 1440 72" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <path d="M0,72 L0,55 L80,40 L160,52 L260,28 L340,44 L440,18 L520,36 L600,22 L680,42 L760,14 L860,38 L960,20 L1060,45 L1160,30 L1260,50 L1360,35 L1440,48 L1440,72 Z" fill="#071209"/>
</svg>

<!-- ── Main ───────────────────────────────────────────── -->
<main class="page-content">
  <div class="container">

    <!-- Tab switcher -->
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="stops">Stops</button>
      <button class="tab-btn" data-tab="days">Day by Day</button>
    </div>

    <!-- STOPS TAB ──────────────────────────────────────── -->
    <div class="tab-panel active" id="tab-stops">
      <div class="agenda-summary" id="agendaSummary"></div>
      <div id="itinerary"></div>
    </div>

    <!-- DAY BY DAY TAB ─────────────────────────────────── -->
    <div class="tab-panel" id="tab-days">
      <div id="dayByDay"></div>
    </div>

  </div>
</main>

<!-- ── Footer ─────────────────────────────────────────── -->
<footer class="footer">
  <svg class="footer-mountains" viewBox="0 0 1440 60" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path d="M0,60 L0,42 L90,28 L180,40 L300,15 L400,32 L500,10 L600,28 L700,18 L800,35 L920,12 L1040,30 L1160,18 L1280,38 L1440,22 L1440,60 Z" fill="rgba(232,184,75,0.07)"/>
  </svg>
  <div class="footer-brand">Peak to Pacific</div>
  <div>Chandler &amp; Teigan · CU Boulder Class of '26 · 🤘</div>
</footer>

<script src="config.js"></script>
<script src="nav-scroll.js" defer></script>
<script>
  // ── Nav mobile ──────────────────────────────────────────
  document.getElementById('mobileBtn').addEventListener('click', () => {
    document.getElementById('navLinks').classList.toggle('open');
  });

  // ── Tab switching ────────────────────────────────────────
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    });
  });

  // ── Build summary strip ────────────────────────────────
  const completed = STOPS.filter(s => s.status === 'completed').length;
  const current   = STOPS.find(s => s.status === 'current');
  const phases    = [...new Set(STOPS.map(s => s.phase))].length;
  const nights    = STOPS.reduce((acc, s) => acc + (s.nights || 0), 0);

  const summaryEl = document.getElementById('agendaSummary');
  summaryEl.innerHTML = `
    <div class="summary-item">
      <span class="s-label">Stops</span>
      <span class="s-value">${STOPS.length}</span>
    </div>
    <div class="summary-divider"></div>
    <div class="summary-item">
      <span class="s-label">Phases</span>
      <span class="s-value">${phases}</span>
    </div>
    <div class="summary-divider"></div>
    <div class="summary-item">
      <span class="s-label">Nights</span>
      <span class="s-value">${nights}+</span>
    </div>
    <div class="summary-divider"></div>
    <div class="summary-item">
      <span class="s-label">Completed</span>
      <span class="s-value">${completed}</span>
    </div>
    <div class="summary-divider"></div>
    <div class="summary-item">
      <span class="s-label">Current</span>
      <span class="s-value" style="font-size:.9rem; color: var(--gold)">${current ? current.name : 'Pre-trip'}</span>
    </div>
  `;

  // ── Group stops by phase ───────────────────────────────
  const grouped = {};
  STOPS.forEach(s => {
    if (!grouped[s.phase]) grouped[s.phase] = [];
    grouped[s.phase].push(s);
  });

  // ── Calculate timeline fill % ──────────────────────────
  const firstUpcomingIdx = STOPS.findIndex(s => s.status !== 'completed');
  const pct = firstUpcomingIdx < 0 ? 100 : Math.round((firstUpcomingIdx / STOPS.length) * 100);

  // ── Render stops tab ───────────────────────────────────
  const itineraryEl = document.getElementById('itinerary');
  let html = '';

  Object.entries(grouped).forEach(([phase, stops]) => {
    html += '<div class="phase-group"><div class="phase-label">' + phase + '</div>'
          + '<div class="stops-list" style="--completed-pct:' + pct + '%">';

    stops.forEach(stop => {
      const highlightsHtml = (stop.highlights || [])
        .map(h => '<span class="highlight-chip">' + h + '</span>').join('');

      const nightsHtml = stop.nights > 0
        ? '<span class="nights-badge">🌙 ' + stop.nights + ' night' + (stop.nights > 1 ? 's' : '') + '</span>'
        : '';

      const youAreHere = stop.status === 'current'
        ? '<div class="you-are-here"><span class="dot-live"></span>You are here right now</div>'
        : '';

      const checkmark = stop.status === 'completed'
        ? '<svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M1.5 5L4 7.5L8.5 2.5" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>'
        : '';

      html += '<div class="stop-item">'
        + '<div class="stop-timeline"><div class="stop-dot ' + stop.status + '">' + checkmark + '</div></div>'
        + '<div class="stop-card ' + stop.status + '">'
        + '<div class="stop-card-inner">'
        + '<div class="stop-header">'
        + '<div class="stop-name-block">'
        + '<div class="stop-emoji-name">'
        + '<span class="stop-emoji">' + stop.emoji + '</span>'
        + '<span class="stop-name">' + stop.name + '</span>'
        + '</div>'
        + '<div class="stop-subtitle">' + stop.subtitle + '</div>'
        + '</div>'
        + '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;">'
        + '<div class="stop-dates">' + stop.dates + '</div>'
        + nightsHtml
        + '</div>'
        + '</div>'
        + (highlightsHtml ? '<div class="stop-highlights">' + highlightsHtml + '</div>' : '')
        + '</div>'
        + youAreHere
        + '</div>'
        + '</div>';
    });

    html += '</div></div>';
  });

  itineraryEl.innerHTML = html;

  // Scroll to current stop
  setTimeout(() => {
    const currentCard = itineraryEl.querySelector('.stop-card.current');
    if (currentCard) currentCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 300);

  // ── Render day-by-day accordion ────────────────────────
  const dayByDayEl = document.getElementById('dayByDay');
  if (typeof DAYS !== 'undefined' && DAYS.length) {
    let dayHtml = '';
    DAYS.forEach(function(day, i) {
      const isToday = day.status === 'today';
      const isPast  = day.status === 'past';
      const cardCls = 'day-card' + (isToday ? ' today' : isPast ? ' past' : '');

      const planItems = (day.plan || [])
        .map(function(item) { return '<li>' + item + '</li>'; }).join('');

      const driveHtml = day.drive
        ? '<span class="day-badge">' + day.drive + '</span>' : '';

      const todayBadge = isToday
        ? '<span class="day-badge today-badge">Today</span>' : '';

      const sleepLine = day.sleep ? ' · Sleep: ' + day.sleep : '';

      dayHtml += '<div class="' + cardCls + '" id="day-' + i + '">'
        + '<div class="day-card-header" onclick="toggleDay(' + i + ')">'
        + '<div class="day-num">Day ' + (i + 1) + '</div>'
        + '<div class="day-meta">'
        + '<div class="day-route">' + day.route + '</div>'
        + '<div class="day-subtitle">' + day.date + sleepLine + '</div>'
        + '</div>'
        + '<div class="day-badges">' + driveHtml + todayBadge + '</div>'
        + '<svg class="day-chevron" width="16" height="16" viewBox="0 0 16 16" fill="none">'
        + '<path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>'
        + '</svg>'
        + '</div>'
        + '<div class="day-card-body"><div class="day-card-inner">'
        + (planItems ? '<ul class="day-plan-list">' + planItems + '</ul>' : '')
        + (day.note ? '<div class="day-note">' + day.note + '</div>' : '')
        + '</div></div>'
        + '</div>';
    });

    dayByDayEl.innerHTML = dayHtml;

    // Auto-open today or first upcoming
    var autoIdx = DAYS.findIndex(function(d) { return d.status === 'today' || d.status === 'upcoming'; });
    if (autoIdx >= 0) toggleDay(autoIdx);
  } else {
    dayByDayEl.innerHTML = '<p style="color:var(--text-muted);padding:20px 0;">Day-by-day details coming soon.</p>';
  }

  function toggleDay(i) {
    var card = document.getElementById('day-' + i);
    if (card) card.classList.toggle('open');
  }
</script>
</body>
</html>
