# ════════════════════════════════════════════════════════════
#  Peak to Pacific — Netlify Config
# ════════════════════════════════════════════════════════════

[build]
  publish = "."          # serve the root folder (all HTML files)
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Redirect so /.netlify/functions/now-playing works cleanly
[[redirects]]
  from = "/api/now-playing"
  to   = "/.netlify/functions/now-playing"
  status = 200
